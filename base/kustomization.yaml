apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomize

resources:
  - deployment.yaml
  - service.yaml

# nginx config mounted over the default server block. Kustomize appends a
# content hash to the generated name, so any config change rolls the pods.
configMapGenerator:
  - name: product-nginx-config
    files:
      - default.conf

patches:
  - target:
      kind: Deployment
      name: product
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: nginx-config
            configMap:
              name: product-nginx-config
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
